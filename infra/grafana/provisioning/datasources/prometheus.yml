apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'         # 수집 간격과 동기화 (API=15s)
      httpMethod: POST
      queryTimeout: '60s'
      exemplarTraceIdDestinations: []
    version: 1
